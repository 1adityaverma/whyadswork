<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Whyadswork?</title>

<style>
:root{--bg:#fff;--fg:#000;--mute:rgba(0,0,0,.58);--line:rgba(0,0,0,.14);--cr:#b0102f;--pu:#4c1d95;--nb:#0b1f4d;--ff:"Libre Baskerville",Baskerville,"Baskerville Old Face",Georgia,"Times New Roman",serif;--mono:var(--ff);--serif:var(--ff);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fff;color:#000}
body{margin:0;background:#fff;color:#000;font-family:var(--ff);font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:3px}
p{margin:0 0 22px}
h1{font:600 clamp(28px,4vw,42px)/1.12 var(--serif);letter-spacing:-.025em;margin:0 0 14px}
.tag{display:inline-flex;align-items:center;gap:7px;margin:0 0 28px;font-size:14px;color:var(--mute);line-height:1}
.tag svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round}
.main a{text-decoration-color:var(--cr);text-underline-offset:3px}

#app{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
#hd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;padding:22px 28px 14px;border-bottom:2px solid #000;margin-bottom:28px}
#brand{text-decoration:none;font:700 clamp(26px,3.4vw,38px)/1 var(--serif);letter-spacing:-.03em}#brand span{color:var(--cr)}
.hr{display:flex;align-items:baseline;gap:20px;font:12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em}.hr i{font-style:normal;color:var(--mute)}.hr a{text-underline-offset:4px;text-decoration-color:var(--cr);text-decoration-thickness:2px}
#sb{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:0 24px 40px 28px}
#sb .lk a{display:block;padding:7px 0 7px 10px;border-left:3px solid transparent;color:#555;text-decoration:none;font-weight:500;line-height:1.35}
#sb .lk a:hover{color:#000}#sb .lk a.on{color:#000;font-weight:700;border-left-color:var(--cr)}
.abt{margin-top:34px}
.gp h4{margin:22px 0 4px;font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.fb{display:flex;align-items:center;gap:11px;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:15px;color:#000;text-align:left;cursor:pointer}
.fb i{flex:none;width:12px;height:12px;border:2px solid var(--c)}.fb[aria-pressed=true]{font-weight:700}.fb[aria-pressed=true] i{background:var(--c)}
.main{padding:56px clamp(20px,5vw,64px) 120px;max-width:760px}
.main.hm{max-width:none;padding:0 28px 80px 8px}

/* thumbnail cards */
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:34px 26px;align-items:start}
.cd{position:relative;display:block;min-height:160px;overflow:hidden;color:#000;text-decoration:none;cursor:pointer;border:2px solid #000;background:#111;transition:transform .15s,box-shadow .15s}
.cd:hover,.cd:focus-visible{transform:translate(-4px,-4px);box-shadow:6px 6px 0 var(--c)}
.cd>img{display:block;width:100%;height:auto;min-height:160px;object-fit:cover}
.ov{position:absolute;inset:0;padding:24px 18px;background:#0b1f4d;color:#fff;opacity:0;transition:opacity .18s}
.cd:hover .ov,.cd:focus-visible .ov{opacity:1}
.ov h3{margin:0;font:700 22px/1.2 var(--serif);letter-spacing:-.015em;color:#fff}
.ov .by{margin:8px 0 0;font-size:13.5px;line-height:1.4;color:rgba(255,255,255,.85)}
.ov .mt{margin:14px 0 0;font:11px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.75)}
@media(hover:none){.cd{background:#0b1f4d}.ov{position:static;opacity:1;padding:14px 16px 16px;background:#0b1f4d}.ov h3{font-size:20px}.ov .mt{display:none}}
.cd.ni{min-height:230px}.cd.ni .ov{opacity:1;background:linear-gradient(rgba(11,31,77,.95),rgba(11,31,77,.95))}

/* inside an ad: video on top (left on wide screens) stays put while the text scrolls */
.bm{flex:none;background:var(--nb);color:#fff;border-bottom:2px solid #000}
.vf{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vf iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vf.ig{aspect-ratio:auto;width:min(100%,400px);height:min(72vh,640px);margin:0 auto;background:#fff}
@media(max-width:819px){.vf.ig{height:46vh}}
.vf .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font:12px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.75);background:var(--nb)}
.mr{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;font-size:16px;line-height:1.7}
.mh{padding:24px 26px 0}.mh h1{margin:0 0 12px;font-size:clamp(22px,2.4vw,28px)}.mh .tag{margin:0 0 20px}
.bx{padding:0 26px 34px}.bx.pt{padding-top:26px}
.bt{margin:0 0 18px;font:700 clamp(20px,2.2vw,24px)/1.25 var(--serif);letter-spacing:-.015em}
.bx .st{margin:30px 0 8px;font:700 16.5px/1.4 var(--serif)}.bx .st:first-child{margin-top:0}
.bx p{margin:0 0 18px}.bx p:last-child{margin-bottom:0}
.bx .br{margin:0 0 22px;padding-bottom:16px;border-bottom:2px solid #000;font-weight:600;overflow-wrap:anywhere}
.bx .mg{margin:0;padding-left:14px;border-left:3px solid var(--cr);font-size:14.5px;line-height:1.6;color:var(--mute)}.bx .mg b{display:block;margin:0 0 8px;font:700 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:#000}.bx .mg p{margin:0 0 10px}.bx .mg p:last-child{margin-bottom:0}
.bx .br a,.bx .ag a{text-decoration-color:var(--cr);text-decoration-thickness:2px;text-underline-offset:4px}
.bx .ag{margin-top:30px;padding-top:20px;border-top:2px solid #000;font-weight:600;overflow-wrap:anywhere}

@media(max-width:860px){.abt{max-width:320px}#app{grid-template-columns:minmax(0,1fr)}#hd{padding:16px;margin-bottom:16px}.hr i{display:none}#sb{position:static;max-height:none;padding:0 16px 16px}.main.hm{padding:0 16px 60px}#sb .lk{display:flex;overflow-x:auto;gap:14px}#sb .lk a{white-space:nowrap}.main{padding-top:36px}}

/* ad window over the home page */
[hidden]{display:none!important}
.md{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(11,31,77,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding:calc(env(safe-area-inset-top,0px) + 60px) 10px calc(env(safe-area-inset-bottom,0px) + 14px);animation:mfi .18s ease-out}
.mp{display:flex;flex-direction:column;width:100%;max-width:720px;height:calc(100vh - 90px);height:calc(100dvh - 90px);max-height:900px;background:#fff;border:2px solid #000;box-shadow:6px 6px 0 var(--pu);outline:0;animation:mup .2s ease-out}
#mc{flex:1;min-height:0;display:flex;flex-direction:column}
.mx{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:2;width:40px;height:40px;padding:0;border:2px solid #000;background:#fff;color:#000;font:700 22px/1 var(--ff);cursor:pointer}.mx:hover{background:#000;color:#fff}
@keyframes mfi{from{opacity:0}to{opacity:1}}
@keyframes mup{from{transform:translateY(14px)}to{transform:none}}
@media(min-width:820px){.md{padding:64px 28px 28px}.mp{max-width:1180px;height:min(calc(100vh - 110px),720px);height:min(calc(100dvh - 110px),720px);box-shadow:8px 8px 0 var(--pu)}#mc{flex-direction:row}.bm{flex:1.6 1 0;display:flex;align-items:center;border-bottom:0;border-right:2px solid #000}.mr{flex:1 1 0;min-width:340px}}
@media(prefers-reduced-motion:reduce){.md,.mp{animation:none}}
</style></head><body>

<script>

 m:'i',

    'The background music theme, at creatively strategic points to highlight the words/visual elements is done well.',

 ag:['Sideways','https://sideways.co.in/work/designed-for-a-better-you']
},{
 m:'g',

 m:'g',

 w:['1) A Woman talking about something “socially uncomfortable”. Especially something mildly related to sexuality.',
    '2) “While send noods” gets your attention. Hyper Exaggeration and deliberate awkward delivery at key points, keeps you there and directs your attention towards the brand.',
    '3) Saying a mispronounced word to make fun of something, is a seventh grader thing, that we all liked.'],

},{
 m:'g',
 t:'Drudgery called Work',
 br:'Coinbase',

 nh:1,
 v:'https://www.youtube.com/embed/0V4CCxskN_0?si=BML_o3BnOxEt85Km',
 img:'coinbase.jpg',
 w:['#1. Saying the pain out loud',
    'Saying the pain of professionalism (standing in line) and corporate trauma. Out loud.',
    '(Even if this pain or frustration with work culture is too common, something we hear every day, the symbolic representation of it through a character still outshines the daily ears the topic catches.)',
    '#2. The familiar opening',
    'The initial curiosity is developed by an open-world game infrastructure, which is familiar to most eyes. (Humans prefer habit, familiar things.) “Here we go again” is the guiding force: the classic GTA San Andreas opening line, where CJ, the main character, falls off the bike and addresses the forthcoming familiar but chaotic monotony of the crime world, after being thrown out by the police upon landing back in his hometown.',
    'I assume the work world isn’t different from the same.',
    '#3. Music and cadence',
    'Background music via creative direction. The cadence and flow are paced as the narrative itself paces. Even the lyrical meaning follows it: the musician first introspects and only at the end realises he needs to be free, which is what the visual narrative was.',
    '#4. Words held back',
    'I love that there are no major words except a single use at the end, for the single communicated idea. NPCs and side characters still talk, which highlights how little inner voice is allowed when you are in that environment of dark buildings. Only the outside talks.',
    '#5. Leaving as continuation',
    'I personally wouldn’t say the ending, or the person leaving the system itself, was a catalyst but a continuation. The first combination, the visual representation of “open world game and corporate drudgery,” tells you the schedule of a normal dude too, who plays games to numb the pain after coming home. Here, though, as it is a fantasy, the day ends with the narrator finding a way to leave the system altogether.',
    '#6. The structure underneath',
    'Make an enemy. Show how they are a problem. And then give them your solution at last.',

 ag:['Isle of any','https://isleofany.com/','',': ']

 m:'g',
 t:'A celebrity “story”',
 br:'FIGS',
 by:'',
 nh:1,
 v:'https://www.youtube.com/embed/v-njJeHk44Y?si=ZGxzmJOmDneATiKO',
 img:'figs.jpg',
 w:['#1) A story to tell.',
    'A serious one, of fractal recovery—said in a rather simple way.',
    'Use of the classic introducing people, in sitcoms and diaries—“So here’s my roommate…”, which we are familiar with, so it isn’t too strange after the not-so-common visuals of bone X-rays. Balancing the contrast sharply.',
    '#2. Use understated/used elements:',
    'Emphasis on human moments like “gasp of overwhelm”, which is highlighted by a continuation of grit. So, inspirational.',

    'An interesting idea here is: doctors don’t make bodies, but rebuild them, let’s say.',
    'Especially using “build” gives more authority in the mix.'],
 ag:['Mother London','https://www.motherlondon.com/work/figs-team-usa','','- ']

 m:'g',
 t:'Relating the masses with their own weird.',

 w:['#1. One idea',
    'This iteration-',
    'One idea- risk averseness. Or loss aversion associated with risk in the second order thinking—The fear the you can lose something by not managing risk on your credit card.',

    '#3. New design',
    'New design idea. Or rather a new design idea, that first catches eye than tells you what it means.',
    'Using coloured boxes with texts, differing in proportionality along with animation. “Enough” to show you the idea. And notice, that too, without real images inside it.'],
 ag:['Bear Meets Eagle On Fire','https://beareaglefire.com/work/bankwest-just-enough-bank/'],
 ig:['#inception campaign ( inside agency page)',
    'One idea- save time. Fast- ness. Something bezos says wouldn’t change of what customers want out of you. Ever.',
    'The inception also had the storytelling element of quoting strict numbers to one’s everyday activities- which, in a good sense, nobody does. therefore, it stood out.']
},{
 m:'g',
 t:'Passion unites people. passion of any kind.',
 br:'Nike',
 brl:'https://about.nike.com/en-GB/newsroom/releases/great-athletes-remind-the-world-theres-nothing-wrong-with-wanting-to-win',
 by:'',
 v:'',
 img:'NIKE.jpg',
 pic:'ad_deleted.jpg',
 alt:'The brand has deleted the ad from the official youtube channel :(',
 w:['#1. Familiarity principle.',
    'A famous Actor’s voice, all famous athletes, the passion to strive and win, the focus’s flow state, the script that is a combination of “an inner monologue that represents human emotions when its striving for something” and “ the before and after reflection and pondering over that moment.”',
    'All of these are not new. are relatable. Or rather passionate-fully, comfortable for us.',
    '#2. Script-',
    'The opening line, “Am i bad person?” shows guilt that is less addressed in the media than it is felt for all of us. ( in any context at all)',
    'The inner monologue is simply questioning itself, but at the same time, using tonal differences, asserting what needs to; as if the voice is self conscious, and at the same time, self admitting and too proud of one’s feelings, too. catching the core human emotion behind wanting success- you can call it “greed” or “want” or something else.',

/* The static card about me, pinned in the left margin. Put your photo's file name (or link) in img. */

 w:['Aditya here. The guy behind this website. I love advertising, or to be more accurate, started liking it while learning it in the process of wanting an advertising job.',

var $=function(s){return document.querySelector(s)};

function adHTML(b){

 b.w.map(function(x){return x.charAt(0)=='#'?'<h3 class="st">'+esc(x.slice(1))+'</h3>':'<p>'+esc(x)+'</p>'}).join('')+
 (b.ag?'<p class="ag">'+'Agency’s Credit- '+'<a href="'+esc(b.ag[1])+'" target="_blank" rel="noopener">'+esc(b.ag[0])+'</a></p>':'')+(b.ig?'<div class="mg">'+b.ig.map(function(x){return x.charAt(0)=='#'?'<b>'+esc(x.slice(1))+'</b>':'<p>'+esc(x)+'</p>'}).join('')+'</div>':'')+
 '</div></div>'}

var main=$('#main'),sb=$('#sb'),md=$('#md'),mc=$('#mc'),mp=$('#mp'),openIdx=-1,pushed=false,lastFocus=null;

 if(openIdx===i)return;var b=i==='about'?ABOUT:BEST[i];

 openIdx=i;mc.innerHTML=adHTML(b);md.setAttribute('aria-label',b.t);md.hidden=false;md.scrollTop=0;

function closeAd(){
